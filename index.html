<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakında Buradayız</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 20s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Arka plan parlama efektleri */
        .glow-1 {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glow-2 {
            background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glow-3 {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        }

        /* Glassmorphism kart efekti */
        .glass-card {
            background: rgba(17, 24, 39, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Gradient Metinler */
        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-accent {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-indigo-500 selection:text-white">

    <!-- Dinamik Arka Plan Parlamaları -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-[600px] h-[600px] glow-1 rounded-full animate-pulse-slow"></div>
        <div class="absolute top-1/2 -right-40 w-[600px] h-[600px] glow-2 rounded-full animate-pulse-slow" style="animation-delay: 2s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-[500px] h-[500px] glow-3 rounded-full animate-pulse-slow" style="animation-delay: 4s;"></div>
        
        <!-- Izgara Desen Overlayi -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f29370f_1px,transparent_1px),linear-gradient(to_bottom,#1f29370f_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
    </div>

    <!-- Üst Bar / Marka & Logo -->
    <header class="relative z-10 w-full max-w-6xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 p-[1px] flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <div class="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center">
                    <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i>
                </div>
            </div>
            <span class="font-extrabold text-xl tracking-tight text-white">MARKA<span class="text-indigo-400">.</span></span>
        </div>

        <!-- Durum Rozeti -->
        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-slate-900/80 border border-slate-800 text-xs text-slate-300 backdrop-blur-md">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span>Geliştirme Aşamasında</span>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-12">
        <div class="max-w-3xl w-full text-center">
            
            <!-- Ana Kart -->
            <div class="glass-card rounded-3xl p-8 sm:p-14 relative overflow-hidden transition-all duration-300 hover:border-slate-700/50">
                
                <!-- Üst Efekt Çizgisi -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 h-[1px] bg-gradient-to-r from-transparent via-indigo-500 to-transparent"></div>

                <!-- Simge -->
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 mb-8 animate-float">
                    <i data-lucide="rocket" class="w-8 h-8"></i>
                </div>

                <!-- Ana Başlık -->
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
                    <span class="text-gradient">Çok Yakında</span> <br class="hidden sm:inline" />
                    <span class="text-gradient-accent">Buradayız.</span>
                </h1>

                <!-- Açıklama Metni -->
                <p class="text-slate-400 text-base sm:text-lg max-w-xl mx-auto leading-relaxed mb-8">
                    Sizlere daha iyi bir deneyim sunabilmek için dijital alanımızı baştan sona yeniliyoruz. Tasarım ve altyapı çalışmalarımız tüm hızıyla devam ediyor.
                </p>

                <!-- Özellik Rozetleri -->
                <div class="flex flex-wrap justify-center gap-3 pt-2">
                    <div class="px-4 py-2 rounded-xl bg-slate-800/40 border border-slate-800 text-xs font-medium text-slate-300 flex items-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i> Modern Deneyim
                    </div>
                    <div class="px-4 py-2 rounded-xl bg-slate-800/40 border border-slate-800 text-xs font-medium text-slate-300 flex items-center gap-2">
                        <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> Güvenli Altyapı
                    </div>
                    <div class="px-4 py-2 rounded-xl bg-slate-800/40 border border-slate-800 text-xs font-medium text-slate-300 flex items-center gap-2">
                        <i data-lucide="palette" class="w-4 h-4 text-pink-400"></i> Şık Tasarım
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Alt Bilgi / Sosyal Medya & İletişim -->
    <footer class="relative z-10 w-full max-w-6xl mx-auto px-6 py-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-sm text-slate-500">
        <div>
            &copy; <span id="year"></span> Tüm hakları saklıdır.
        </div>

        <!-- Sosyal Medya İkonları -->
        <div class="flex items-center space-x-4">
            <a href="#" class="w-9 h-9 rounded-lg bg-slate-900/80 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all" title="Instagram">
                <i data-lucide="instagram" class="w-4 h-4"></i>
            </a>
            <a href="#" class="w-9 h-9 rounded-lg bg-slate-900/80 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all" title="Twitter / X">
                <i data-lucide="twitter" class="w-4 h-4"></i>
            </a>
            <a href="#" class="w-9 h-9 rounded-lg bg-slate-900/80 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all" title="LinkedIn">
                <i data-lucide="linkedin" class="w-4 h-4"></i>
            </a>
            <a href="mailto:info@example.com" class="w-9 h-9 rounded-lg bg-slate-900/80 border border-slate-800 flex items-center justify-center text-slate-400 hover:text-white hover:border-slate-700 transition-all" title="E-posta Gönder">
                <i data-lucide="mail" class="w-4 h-4"></i>
            </a>
        </div>
    </footer>

    <!-- Lucide İkon Başlatıcı & Yıl Dinamiği -->
    <script>
        // İkonları yükle
        lucide.createIcons();

        // Otomatik güncel yıl
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
